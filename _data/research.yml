# ---------------------------------------------------------------
# RESEARCH section.  Three lists: working_papers, work_in_progress,
# publications.  To add a paper, copy one entry and edit it.
#
# Fields (all optional except title):
#   title      – paper title (shown in capitals automatically)
#   pdf        – link for the title (usually /s/research/FILE.pdf)
#   authors    – list of {name, url}; url optional
#   links      – list of {label, url} shown after the authors (Appendix, Slides…)
#   status     – e.g. "Revision requested at the <em>American Economic Review</em>"
#   journal    – for publications, e.g. "The Review of Economic Studies (2024)"
#   extra      – list of extra lines (HTML allowed), each shown as its own line
#   awards     – list of lines shown in italics
#   abstract   – optional; if present a small "Abstract" toggle appears
# ---------------------------------------------------------------

