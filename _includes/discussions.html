<section id="discussions" class="index-section">
  <div class="content">
    <h2>Discussions</h2>
    <ul class="plain-list discussion-list">
      {% for d in site.data.discussions %}
      <li><a class="entry-title" href="{{ d.pdf | relative_url }}">{{ d.title }}</a> | {{ d.venue }} | {{ d.year }}{% for e in d.extra %} | <a href="{{ e.url | relative_url }}"{% if e.url contains 'http' %} target="_blank" rel="noopener"{% endif %}>{{ e.label }}</a>{% endfor %}</li>
      {% endfor %}
    </ul>
  </div>
</section>
