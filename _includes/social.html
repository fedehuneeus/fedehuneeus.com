{% comment %} usage: {% include social.html class="..." %} {% endcomment %}
<div class="social {{ include.class }}">
  {% for s in site.data.profile.social %}
  <a href="{{ s.url }}" title="{{ s.name }}" aria-label="{{ s.name }}"{% unless s.url contains 'mailto:' %} target="_blank" rel="noopener"{% endunless %}>
    {% case s.icon %}
    {% when 'linkedin' %}<svg viewBox="0 0 24 24"><path d="M6.5 8.5H3.6V20h2.9V8.5zM5 4a1.7 1.7 0 1 0 0 3.4A1.7 1.7 0 0 0 5 4zm15 9.1c0-3.3-1.8-4.8-4.2-4.8-1.9 0-2.8 1.1-3.3 1.8V8.5h-2.9c0 .8 0 11.5 0 11.5h2.9v-6.4c0-.3 0-.7.1-.9.3-.7.9-1.4 2-1.4 1.4 0 2 1.1 2 2.6V20H20v-6.9z"/></svg>
    {% when 'email' %}<svg viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2.4V17h16V7.4l-8 5.3-8-5.3zM5.2 7l6.8 4.5L18.8 7H5.2z"/></svg>
    {% when 'scholar' %}<svg viewBox="0 0 24 24"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3zm-6 10.6V17c0 1.7 2.7 4 6 4s6-2.3 6-4v-3.4l-6 3.3-6-3.3z"/></svg>
    {% else %}<svg viewBox="0 0 24 24"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l2.8-2.8a1 1 0 1 1 1.4 1.4L12 13.4a1 1 0 0 1-1.4 0zm-2.1 4.9a3.5 3.5 0 0 1 0-5l1.4-1.4-1.4-1.4-1.4 1.4a5.5 5.5 0 1 0 7.8 7.8l1.4-1.4-1.4-1.4-1.4 1.4a3.5 3.5 0 0 1-5 0zm7-13.6-1.4 1.4 1.4 1.4 1.4-1.4a3.5 3.5 0 0 1 5 5l-1.4 1.4 1.4 1.4 1.4-1.4a5.5 5.5 0 0 0-7.8-7.8z"/></svg>
    {% endcase %}
  </a>
  {% endfor %}
</div>
