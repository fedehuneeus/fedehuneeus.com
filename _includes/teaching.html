{% assign t = site.data.teaching %}
<section id="teaching" class="index-section alt-section">
  <div class="content">
    <h2>Teaching</h2>
    {% for g in t.groups %}
    <h3>{{ g.heading }}</h3>
    <ul class="plain-list course-list">
      {% for c in g.courses %}<li><a class="entry-title" href="{{ c.syllabus | relative_url }}">{{ c.name }}</a></li>{% endfor %}
    </ul>
    {% endfor %}

    <h2 class="h2-gap">Pre-Doctoral Work</h2>
    {% for p in t.predoctoral %}{% include paper.html p=p %}{% endfor %}
  </div>
</section>
